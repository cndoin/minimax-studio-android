name: Bug report
description: 报告一个可以复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈问题。请不要在描述、截图或日志中公开 API Key 和个人信息。
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请按顺序描述如何触发问题。
      placeholder: |
        1. 打开……
        2. 输入……
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境信息
      description: 请填写应用版本、Android 版本和设备型号。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 粘贴经过脱敏的相关日志，不要包含 API Key。
      render: text
