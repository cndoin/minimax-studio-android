name: Feature request
description: 提议一个新功能或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请说明这个功能对用户有什么帮助。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请描述你期望的交互或实现方式。
    validations:
      required: true
